<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>AnimalyCraft</title><meta name="description" content="A cozy cube-world math adventure for young explorers."><link rel="stylesheet" href="/css/styles.css"></head>
<body>
<div id="game"></div>
<section id="welcome" class="screen"><div class="welcome-card"><div class="logo"><span>Animaly</span>Craft<i>🍃</i></div><p class="eyebrow">A cozy math adventure</p><h1>Build a camp. Help your friends.<br>Solve it together.</h1><label>Your explorer name<input id="nameInput" maxlength="20" placeholder="Type your name" autocomplete="off"></label><div class="welcome-actions"><button id="newBtn" class="primary">🐾 New Adventure</button><button id="continueBtn" class="secondary">Continue</button></div><p id="dbMessage" class="error hidden"></p></div><div class="welcome-animals"><span>🦊</span><span>🐰</span><span>🐻</span></div></section>
<main id="play" class="hidden">
 <header class="hud"><div class="profile"><span id="avatar">🐰</span><div><b id="playerLabel">Explorer</b><small id="characterLabel">Rabbit · Little Hop</small></div></div><div class="currencies"><span>◉ <b id="pearls">0</b> Pearls</span><span>◆ <b id="amber">0</b> Amber</span></div><div class="hud-actions"><button data-open="shop">Shop</button><button data-open="explorers">My Explorers</button><button data-open="settings" aria-label="Settings">⚙</button></div></header>
 <aside class="quest panel"><small>CURRENT ADVENTURE</small><b id="missionLabel">Find a glowing paw marker</b><div class="progress-label"><span>🍎 Camp food</span><span id="foodText">0%</span></div><div class="bar"><i id="foodBar"></i></div><div class="progress-label"><span>🏠 Shelter</span><span id="shelterText">0%</span></div><div class="bar peach"><i id="shelterBar"></i></div><div class="inventory"><span>🍎 <b id="invApple">0</b></span><span>🍃 <b id="invLeaf">0</b></span><span>🪵 <b id="invWood">0</b></span></div></aside>
 <div id="hint" class="interaction hidden"><kbd>E</kbd> <span>Interact</span></div><div id="powerHint" class="power-hint">Q · Explorer power</div><div id="toast" role="status"></div>
 <div class="touch"><div class="dpad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div><button data-key="Space">Jump</button><button id="touchInteract">E</button><button id="touchPower">Power</button></div></div>
</main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><button id="closeModal" class="close" aria-label="Close">×</button><div id="modalBody"></div></div></div>
<script type="module" src="/js/main.js"></script></body></html>
